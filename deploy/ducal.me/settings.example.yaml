# settings.yaml — vitrine de la couche maître (estate ducal.me)
# Monté dans /app/config. Regroupe les tuiles par couche/domaine.
---
title: Estate ducal.me
theme: dark
color: slate
headerStyle: clean
target: _blank

# Ordre et disposition des groupes découverts via annotations gethomepage.dev/group
layout:
  Infra:
    style: row
    columns: 4
  Produits:
    style: row
    columns: 4

# L'auth n'est pas ici : elle est faite par le forward-auth Traefik + LDAP en amont.
# Cette instance est gatée pour le groupe LDAP "admins".
providers: {}
