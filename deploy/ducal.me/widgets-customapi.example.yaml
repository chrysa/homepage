# services.yaml (extrait) — brancher une surface métier en lecture seule.
# Le widget `customapi` lit un endpoint REST borné et affiche quelques champs.
# Aucune écriture ; le secret d'en-tête vient d'un Secret monté, jamais en clair.
---
- Audit:
    - État de la flotte:
        icon: si-checkmarx
        href: https://audit.ducal.me
        # Statut up/down :
        siteMonitor: https://audit.ducal.me
        widget:
          type: customapi
          url: https://audit.ducal.me/api/v1/fleet/summary
          method: GET
          headers:
            # Injecté depuis un Secret via l'env de Homepage, pas écrit ici :
            Authorization: "Bearer {{HOMEPAGE_VAR_FLEET_TOKEN}}"
          refreshInterval: 60000
          mappings:
            - field: projects
              label: Projets
              format: number
            - field: findings_high
              label: Findings hauts
              format: number
            - field: compliant_ratio
              label: Conformité
              format: percent
