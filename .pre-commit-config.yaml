# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: "(^mkdocs\\.yml$)"
      - id: check-added-large-files
      - id: check-json
      - id: detect-private-key
      - args:
          - --branch
          - main
        id: no-commit-to-branch
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 'v3.3.3'
    hooks:
      - id: prettier
        types_or:
          - javascript
          - markdown
          - jsx
        additional_dependencies:
          - prettier@3.3.3
          - 'prettier-plugin-organize-imports@4.1.0'
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - args:
          - --fix
        id: markdownlint
        stages:
          - manual
  - repo: https://github.com/chrysa/pre-commit-tools
    rev: v0.2.0-253
    hooks:
      - id: makefile-check
      - exclude: ^(\.github/|workflows/|templates/|docker-compose)|(^|/)(pnpm-lock|yarn|uv|poetry)\.(yaml|lock)$|(^|/)\.pre-commit-config\.yaml$
        id: yaml-sorter
      - id: json-sorter
      - id: env-file-check
      - id: env-example-sync
      - id: adr-gate
      - id: claude-skill-frontmatter
      - id: claude-agent-frontmatter
      - id: claude-mcp-config
      - id: python-print-detection
        exclude: (^|/)tests?/|^(README\.md|docs/)|(^|/)quality_gate\.py$|^\.claude/ape/
      - id: python-unreachable-code
      - id: python-no-unittest-import
      - id: python-untyped-raise
        exclude: (^|/)tests?/
      - id: python-dispatch-ladder
      - id: claude-assets-present
      - id: no-hardcoded-localhost
        exclude: tests?/|\.test\.|\.spec\.
      - id: regression-gate
        stages:
          - pre-push
      - id: console-log-detection
      - id: console-debug-detection
      - id: react-console-error-detection
      - id: no-console-warn
      - id: ts-unreachable-code
      - id: import-no-relative-parent
      - id: react-no-async-in-useeffect
      - id: react-direct-dom
  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - args:
          - --error
          - DL3006
          - --error
          - DL3007
          - --failure-threshold
          - error
        files: (^|/)Dockerfile[^/]*$
        id: hadolint-docker
        types:
          - file
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args:
          - feat
          - fix
          - docs
          - style
          - refactor
          - test
          - chore
          - perf
          - revert
          - ci
  - repo: https://github.com/chrysa/guideline-checker
    rev: v1.30.10
    hooks:
      - id: guideline-check
        args:
          - check
          - --fail-on
          - error
          - --baseline
          - .guideline-baseline.json
exclude: (^|/)quality_gate\.py$|^\.claude/ape/
